<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask API - Miranda Activity 7</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px;
            font-family: Arial, sans-serif;
            background: #eaf5ff;
            color: #183b5b;
        }

        .container {
            width: 100%;
            max-width: 950px;
            margin: auto;
        }

        header {
            text-align: center;
            padding: 25px;
            margin-bottom: 25px;
            background: #c9e5ff;
            border: 1px solid #a8d3ff;
            border-radius: 15px;
        }

        header h1 {
            color: #1765a8;
            margin: 0 0 10px;
        }

        header p {
            margin-bottom: 0;
        }

        .card {
            background: #d7ebff;
            border: 1px solid #a8d3ff;
            border-radius: 15px;
            padding: 22px;
            margin-bottom: 22px;
            box-shadow: 0 4px 10px rgba(30, 90, 140, 0.08);
        }

        h2 {
            margin-top: 0;
            color: #1765a8;
        }

        button {
            background: #1976d2;
            color: #ffffff;
            border: none;
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            margin: 5px 0;
        }

        button:hover {
            background: #125da8;
        }

        button:focus-visible,
        input:focus-visible {
            outline: 3px solid #ffbf47;
            outline-offset: 3px;
        }

        input {
            display: block;
            width: 100%;
            max-width: 450px;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #91c6f5;
            border-radius: 8px;
            font-size: 15px;
        }

        .result {
            background: #f5fbff;
            border: 1px solid #b5dcff;
            border-radius: 9px;
            padding: 14px;
            margin-top: 15px;
            overflow-wrap: anywhere;
        }

        .student {
            background: #f5fbff;
            border: 1px solid #b5dcff;
            border-radius: 10px;
            padding: 15px;
            margin: 12px 0;
        }

        .student h3 {
            color: #1765a8;
            margin-top: 0;
        }

        .student p {
            margin: 7px 0;
        }

        .error {
            color: #b42318;
        }

        footer {
            text-align: center;
            color: #426b8e;
            padding: 15px;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .card {
                padding: 16px;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <header>
        <h1>Flask API Web Interface</h1>
        <p>Laboratory Activity 6 and Activity 7</p>
        <p>Building a Simple Web Interface and Integrating SQLite</p>
    </header>

    <!-- Activity 6: Student Information API -->
    <section class="card">
        <h2>Student Information API</h2>
        <button type="button" onclick="loadStudent()">
            Load Student Information
        </button>

        <div class="result" id="studentResult" aria-live="polite">
            Click the button to load student information.
        </div>
    </section>

    <!-- Activity 6: Greeting API -->
    <section class="card">
        <h2>Greeting API</h2>

        <input
            type="text"
            id="firstName"
            placeholder="Enter your first name"
            aria-label="Your first name"
        >

        <button type="button" onclick="sayHello()">Say Hello</button>

        <div class="result" id="greetingResult" aria-live="polite">
            Please enter your first name.
        </div>
    </section
